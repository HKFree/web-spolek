# Dev nasazení s redakcí, viz README.
services:
  redakce:
    build:
      context: .
      dockerfile: deploy/redakce/Containerfile
      args:
        PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    restart: unless-stopped
    healthcheck:
      # zdravá po prvním zveřejnění
      test: ['CMD', 'test', '-e', '/srv/www/current/index.html']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s
    environment:
      AUTH_MODE: ${AUTH_MODE:-password}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GIT_REMOTE: ${GIT_REMOTE:-}
      GIT_BRANCH: ${GIT_BRANCH:-redakce-dev}
      GIT_PUSH: ${GIT_PUSH:-false}
      GIT_SSH_COMMAND: ${GIT_SSH_COMMAND:-}
    volumes:
      - repo:/srv/repo
      - www:/srv/www
      # Deploy klíč pro push (chown 1000:1000, chmod 600):
      # - ./deploy-key:/run/secrets/deploy-key:ro

  web:
    image: docker.io/library/nginx:1-alpine-slim
    restart: unless-stopped
    depends_on:
      redakce:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: '1'
    volumes:
      - www:/srv/www:ro
      - ./deploy/redakce/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/redakce/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro

volumes:
  repo:
  www:
