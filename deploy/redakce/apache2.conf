# Příklad HTTPS VirtualHost pro Apache2 před dev nasazením (compose.yaml) na stejném stroji.
# Uprav ServerName, X-Forwarded-Host (stejné jako PUBLIC_DOMAIN v .env), cesty k certifikátu
# a port podle WEB_PORT (v .env např. WEB_PORT=127.0.0.1:8080).
# Moduly: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName spolek.example.cz

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/hkfree-fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/hkfree.key

    ProxyRequests Off
    ProxyPreserveHost On
    # Nahraď hlavičky od klienta důvěryhodnými hodnotami této HTTPS proxy.
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Host "spolek.example.cz"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Keystatic posílá obrázky a PDF jako base64 v JSON; redakce přijme nejvýše 32 MiB.
    LimitRequestBody 33554432
    ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
