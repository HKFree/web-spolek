# nginx pro dev nasazení s redakcí: statika z /srv/www/current, redakce na Node.

# Za HTTPS proxy (Apache apod.) převezmi její protokol, jinak použij vlastní.
map $http_x_forwarded_proto $redakce_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /srv/www/current;

    # Adresu redakce zjišťuj průběžně, po restartu kontejneru se mění.
    # NGINX_LOCAL_RESOLVERS doplní nginx image z /etc/resolv.conf (viz compose.yaml).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $redakce http://redakce:4321;

    absolute_redirect off;
    server_tokens off;
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/rss+xml text/plain application/json;
    gzip_min_length 1024;

    # 301 ze starých WordPress adres (generuje src/pages/nginx-redirects.conf.ts)
    include /srv/www/current/nginx-redirects*.conf;

    location ^~ /keystatic { proxy_pass $redakce; include /etc/nginx/conf.d/proxy.inc; }
    location ^~ /api/keystatic/ { proxy_pass $redakce; include /etc/nginx/conf.d/proxy.inc; }
    location = /api/redakce/status { proxy_pass $redakce; include /etc/nginx/conf.d/proxy.inc; }
    location ^~ /auth/ { proxy_pass $redakce; include /etc/nginx/conf.d/proxy.inc; }
    location @redakce { proxy_pass $redakce; include /etc/nginx/conf.d/proxy.inc; }

    # Assety webu i redakce mají hash v názvu; co není ve statice, patří redakci.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @redakce;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
