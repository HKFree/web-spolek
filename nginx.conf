server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/rss+xml text/plain;
    gzip_min_length 1024;

    # 301 ze starých WordPress adres (generuje src/pages/nginx-redirects.conf.ts)
    include /etc/nginx/redirects.conf;

    # Astro assety mají hash v názvu
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
